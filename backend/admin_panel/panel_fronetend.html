<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ÖL Admin Panel</title>
    <link rel="stylesheet" href="./style.css">
    <link rel="icon" type="image/x-icon" href="./images/lök_bild_cog.ico">
</head>
<body>
    <header>
        <a href="./panel_fronetend.html"><img id="header_titel_image" alt="Östra Löken logo" src="../../frontend/webbpage/images/logo/östra löken i östra format rak vit text.png"></a>
        <p><b>Admin Panel</b></p>
    </header>

    <main>
        <form>
            <h2>Ny upplaga!</h2>

            <label for="upplaga_input">Upplaga numer:</label><br>
            <input type="number" id="upplaga_input"><br>

            <div id="add_button_container">
                <button id="new_article_button">Lägg till en artikel</button>
                <button id="new_hear_me_out_button">Lägg till en hear me out</button>
                <button id="new_notis_button">Lägg till en notis</button>
            </div>

            <div class="article">

                <label for="article_name">Namn på artikel:</label><br>
                <input type="text" id="article_name"><br><br>
                
                <label for="article_type">Typ av artikel:</label><br>
                <input type="text" id="article_type"><br><br>

                <label for="writer_name">Skribent:</label><br>
                <input type="text" id="writer_name"><br><br> <!-- Om den ska se ut som när den renderas: style="font-weight: bold; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;"-->

                <label for="whole_article">Artikel:</label><br>
                <textarea id="whole_article" rows="12" cols="70"></textarea>
            </div>

            <input type="submit">
        </form>

        <!--
        Att ha:
            [] att man kan lägga till normala artiklar
                [] att man kan skriva in artikelnamn, artikel, skribent, plasering, upplaga och typ av artikel
                [] att man kan trycka på verkställa knap för att den ska läggas till
                [] att man ska kunna lägga till bild men att den känner igen om man inte gör det
                [] att man ska kunna förhandsgranska artikel
            [] att man ska kunna lägga till hear me outs 
                [] att man kan skriva in hear me out och beskrivning
                [] att man kan trycka på verkställa knap för att den ska läggas till
            [] att man ska kunna lägga till notiser
                [] att man kan skriva in rubrik och notis
                [] att man kan trycka på verkställa knap för att den ska läggas till
            [] att man ska redigera alla artiklar, hear me outs och notiser
                [] att man kan se alla artiklar, hear me outs och notiser på separata listor
                [] att man kan redigera dem
                [] att man kan ta bort dem
                [] att man kan byta plats på hear me outs och notiser
            [] att man kan lägga in pdf upplagor
            [] att man kan uppdatera om oss
        -->
    </main>
    
    <footer id="footer">
        <div class="footer_text">
            <p>
                Det här är Östra Lökens Admin Panel<br>
                Sidan är endast till för att köras localt<br>
                Admin Panel är utvecklad av Vilhelm Grill
            </p> 
        </div>
    </footer>
</body>
</html>
